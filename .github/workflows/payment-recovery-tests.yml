name: Payment Recovery Tests

on:
  pull_request:
    branches: [feature/firebase-google-signin, integration/payment-recovery-staging]
  push:
    branches: [integration/payment-recovery-staging]

jobs:
  payment-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check server syntax
        run: node --check server.js
      - name: Run payment recovery tests
        run: npm test
