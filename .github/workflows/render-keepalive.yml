name: Keep Ghar ka Khana Awake

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping-render:
    name: Ping Render backend
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request backend health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 --max-time 120 \
            -o /dev/null \
            -w 'HTTP status: %{http_code}\n' \
            https://ghar-ka-khana-backend-pmxm.onrender.com/health
