name: Keep Ghar ka Khana Awake

on:
  workflow_dispatch:
  schedule:
    # 7:45 AM–8:25 AM IST, every 10 minutes (UTC is 5h30m behind IST)
    - cron: '15,25,35,45,55 2 * * *'
    # 8:30 AM–9:25 PM IST, every 10 minutes
    - cron: '*/10 3-15 * * *'

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping-render:
    name: Ping Render backend
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request backend health endpoint
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 5 --max-time 120 \
            -o /dev/null \
            -w 'HTTP status: %{http_code}\n' \
            https://ghar-ka-khana-backend-pmxm.onrender.com/health
