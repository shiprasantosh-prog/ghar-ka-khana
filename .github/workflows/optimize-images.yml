name: Optimize menu images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install image optimizer
        run: npm install --no-save sharp@0.33.5

      - name: Compress JPEG menu images
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const roots = [
            path.join(process.cwd(), 'public', 'images')
          ];

          function walk(dir) {
            return fs.readdirSync(dir, { withFileTypes: true }).flatMap(entry => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
          }

          (async () => {
            const files = roots.flatMap(walk).filter(file => /\.(jpe?g)$/i.test(file));
            let changed = 0;
            let before = 0;
            let after = 0;

            for (const file of files) {
              const input = fs.readFileSync(file);
              before += input.length;

              const output = await sharp(input, { failOn: 'none' })
                .resize({
                  width: 1200,
                  height: 1200,
                  fit: 'inside',
                  withoutEnlargement: true
                })
                .jpeg({
                  quality: 80,
                  progressive: true,
                  mozjpeg: true
                })
                .toBuffer();

              if (output.length < input.length * 0.92) {
                fs.writeFileSync(file, output);
                changed++;
                after += output.length;
              } else {
                after += input.length;
              }
            }

            console.log(`Checked ${files.length} JPEGs; optimized ${changed} files.`);
            console.log(`JPEG bytes: ${(before / 1024 / 1024).toFixed(2)} MB -> ${(after / 1024 / 1024).toFixed(2)} MB`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Convert story thumbnail to WebP
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          (async () => {
            const imageDir = path.join(process.cwd(), 'public', 'images');
            const input = path.join(imageDir, 'Ghar Ka Khana_ Homemade Thali Story.png');
            const output = path.join(imageDir, 'Ghar Ka Khana_ Homemade Thali Story.webp');
            if (!fs.existsSync(input)) throw new Error('Story thumbnail source PNG was not found.');

            const before = fs.statSync(input).size;
            await sharp(input, { failOn: 'none' })
              .resize({ width: 1200, height: 1200, fit: 'inside', withoutEnlargement: true })
              .webp({ quality: 80, effort: 5 })
              .toFile(output);
            const after = fs.statSync(output).size;
            console.log(`Story thumbnail: ${(before / 1024 / 1024).toFixed(2)} MB PNG -> ${(after / 1024 / 1024).toFixed(2)} MB WebP`);

            const htmlPath = path.join(process.cwd(), 'public', 'index.html');
            let html = fs.readFileSync(htmlPath, 'utf8');
            const oldPoster = 'Ghar%20Ka%20Khana_%20Homemade%20Thali%20Story.png';
            const newPoster = 'Ghar%20Ka%20Khana_%20Homemade%20Thali%20Story.webp';
            if (!html.includes(oldPoster) && !html.includes(newPoster)) {
              throw new Error('Story thumbnail poster reference was not found in public/index.html.');
            }
            html = html.replaceAll(oldPoster, newPoster);
            fs.writeFileSync(htmlPath, html);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images public/index.html
          if git diff --cached --quiet; then
            echo "No image changes to commit."
          else
            git commit -m "Optimize website images [skip ci]"
            git push
          fi
