<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard | Ghar ka Khana</title><style>
:root{--bg:#100f0d;--panel:#1d1a16;--gold:#d8b66c;--cream:#f6efdf;--muted:#b9ad97;--line:#413727;--red:#d87d6c;--green:#8cc49b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#302719,#100f0d 55%);color:var(--cream);font:15px/1.5 system-ui, sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.brand{color:var(--gold);letter-spacing:.16em;text-transform:uppercase;font-size:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}h1,h2{margin:.2em 0}h1{font-family:Georgia,serif;font-size:clamp(28px,5vw,42px)}.card{background:rgba(29,26,22,.96);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 15px 45px #0004}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}label{color:var(--muted);font-size:13px}input,textarea,select{width:100%;background:#11100e;color:var(--cream);border:1px solid #514532;border-radius:9px;padding:12px;font:inherit}textarea{min-height:75px;resize:vertical}button{border:1px solid var(--gold);background:var(--gold);color:#17130b;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:transparent;color:var(--gold)}button.danger{border-color:#855247;color:#f1a99b;background:transparent}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}.notice{margin:12px 0;color:var(--gold)}.hidden{display:none}.item{display:flex;justify-content:space-between;align-items:center;gap:15px;border-top:1px solid var(--line);padding:14px 0}.item:first-child{border-top:0}.item strong{display:block}.pill{font-size:12px;color:var(--green)}.pill.off{color:var(--red)}@media(max-width:650px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><div class="head"><div><div class="brand">Ghar ka Khana · Owner</div><h1>Dashboard</h1><div class="muted">Manage your menu and availability.</div></div><div class="actions"><a href="/" style="color:var(--gold);align-self:center">View website ↗</a><button id="logout" class="secondary hidden">Log out</button></div></div>
<section id="login" class="card"><h2>Owner sign in</h2><p class="muted">Use the owner phone number and password configured for your website.</p><form id="loginForm"><div class="grid"><div class="field"><label>Phone number</label><input name="phone" autocomplete="username" required></div><div class="field"><label>Password</label><input name="password" type="password" autocomplete="current-password" required></div></div><p><button>Sign in</button></p></form><div id="loginMsg" class="notice" role="status"></div></section>
<section id="app" class="hidden"><div class="card"><h2 id="formTitle">Add a dish</h2><form id="dishForm"><input type="hidden" name="id"><div class="grid"><div class="field"><label>Dish name</label><input name="name" required maxlength="100"></div><div class="field"><label>Category</label><input name="category" placeholder="Main Course, Snacks, Parathas…" required maxlength="60"></div><div class="field"><label>Price (₹)</label><input name="price" type="number" min="1" step="1" required></div><div class="field"><label>Image URL (optional)</label><input name="image" type="url" placeholder="https://…"></div></div><div class="field" style="margin-top:14px"><label>Description</label><textarea name="description" maxlength="500"></textarea></div><p class="actions"><button id="saveBtn">Save dish</button><button type="button" id="cancelEdit" class="secondary hidden">Cancel edit</button></p><div id="formMsg" class="notice" role="status"></div></form></div><div class="card"><div class="head"><div><h2>Your menu</h2><div class="muted">Edits are saved to the server.</div></div><button id="refresh" class="secondary">Refresh</button></div><div id="menuList"></div></div></section></main>
<script>
const $=s=>document.querySelector(s), api=async(url,opts={})=>{const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed');return data};
function msg(id,text){$(id).textContent=text||''}function editReset(){$('#dishForm').reset();$('#dishForm [name=id]').value='';$('#formTitle').textContent='Add a dish';$('#saveBtn').textContent='Save dish';$('#cancelEdit').classList.add('hidden')}
async function loadMenu(){const rows=await api('/api/admin/menu');$('#menuList').innerHTML=rows.length?rows.map(d=>`<div class="item"><div><strong>${esc(d.name)} · ₹${d.price}</strong><div class="muted">${esc(d.category)}${d.description?' · '+esc(d.description):''}</div><span class="pill ${d.available?'':'off'}">${d.available?'Available':'Unavailable'}</span></div><div class="actions"><button class="secondary" data-edit="${d.id}">Edit</button><button class="secondary" data-toggle="${d.id}" data-on="${d.available?1:0}">${d.available?'Mark unavailable':'Make available'}</button><button class="danger" data-archive="${d.id}">Remove</button></div></div>`).join(''):'<p class="muted">No dishes yet. Add your first item above.</p>';}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function showApp(){ $('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#logout').classList.remove('hidden');await loadMenu()}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();msg('#loginMsg','Signing in…');const f=new FormData(e.target);try{const result=await api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});if(result.user.role!=='admin')throw Error('This account does not have owner access.');msg('#loginMsg','');await showApp()}catch(err){msg('#loginMsg',err.message)}});
$('#dishForm').addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const id=f.id;delete f.id;f.price=Number(f.price);try{await api(id?`/api/menu/${id}`:'/api/menu',{method:id?'PATCH':'POST',body:JSON.stringify(f)});msg('#formMsg',id?'Dish updated.':'Dish added.');editReset();await loadMenu()}catch(err){msg('#formMsg',err.message)}});
$('#menuList').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{const rows=await api('/api/admin/menu');const d=rows.find(x=>x.id===Number(b.dataset.edit||b.dataset.toggle||b.dataset.archive));if(b.dataset.edit){for(const k of ['id','name','category','price','image','description'])$('#dishForm [name='+k+']').value=d[k]??'';$('#formTitle').textContent='Edit dish';$('#saveBtn').textContent='Update dish';$('#cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}else if(b.dataset.toggle){await api('/api/menu/'+d.id,{method:'PATCH',body:JSON.stringify({available:!d.available})});await loadMenu()}else if(b.dataset.archive){if(confirm(`Remove ${d.name} from the customer menu?`)){await api('/api/menu/'+d.id,{method:'DELETE'});await loadMenu()}}}catch(err){alert(err.message)}});
$('#cancelEdit').onclick=editReset;$('#refresh').onclick=()=>loadMenu().catch(e=>alert(e.message));$('#logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.reload()};api('/api/auth/me').then(x=>{if(x.user.role==='admin')showApp()}).catch(()=>{});
</script></body></html>
